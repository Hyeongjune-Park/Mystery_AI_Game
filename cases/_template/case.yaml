# 케이스 기본 정보
id: c_CHANGE_ME  # 고유한 케이스 ID로 변경하세요 (예: c002, c003)
title: 케이스 제목을 입력하세요
subtitle: Case Title in English
synopsis: 짧은 요약 설명을 입력하세요. 플레이어가 게임 시작 전에 보게 됩니다.

# 게임 설정
difficulty: normal  # easy, normal, hard 중 선택
estimatedMinutes: 30  # 예상 플레이 시간 (분)

# 화면 플로우 (순서대로 표시됨)
# 기본 플로우를 유지하거나, 필요에 따라 수정 가능
screenFlow:
  - intro      # 게임 소개 화면
  - story      # 스토리 인트로 화면
  - npcs       # NPC 소개 화면
  - locations  # 장소 소개 화면
  - game       # 메인 게임 화면

# 엔딩 정보
endings:
  - id: bad
    label: 미해결 사건
    tier: bad
    description: 범인을 잘못 지목하거나 증거가 부족하여 사건이 미해결로 종결

  - id: normal
    label: 범인 검거
    tier: normal
    description: 범인을 정확히 지목하고 핵심 증거를 60% 이상 확보

  - id: true
    label: 완벽한 추리
    tier: true
    description: 범인, 동기, 방법을 모두 밝히고 핵심 증거 90% 이상 확보

  - id: timeout
    label: 시간 초과
    tier: timeout
    description: 턴 수를 초과하여 범인이 도주

# 랜덤화 설정
randomization:
  clueOrder: false  # 단서 발견 순서 랜덤화
  decoyRate: 0.15   # 함정 단서 비율 (0.0 ~ 1.0)

# 난이도별 설정
settings:
  turnLimit:
    easy: null    # null = 무제한
    normal: 50
    hard: 30
  hintLimit:
    easy: null    # null = 무제한
    normal: 3
    hard: 0
