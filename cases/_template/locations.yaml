# 장소 인트로 화면 설정

intro:
  title: 주요 장소 안내
  description: 사건과 관련된 장소들입니다. 각 장소를 조사하여 단서를 찾으세요.
  tips:
    - 각 장소의 오브젝트를 주의깊게 관찰하세요
    - NPC와 대화할 때 장소와 관련된 질문을 하면 더 많은 정보를 얻을 수 있습니다
    - 증거들 사이의 연관성을 찾는 것이 중요합니다
    - 게임 중 언제든 장소 정보를 다시 확인할 수 있습니다

# 장소 목록
# 최소 1개 이상의 장소가 필요합니다
locations:
  - id: location.crime_scene  # 고유한 ID (location.으로 시작)
    name: 사건 현장
    floor: 1층  # 또는 지하, 옥상 등
    description: 장소에 대한 설명을 작성하세요. 어떤 곳인지, 왜 중요한지 설명합니다.
    objects:
      # 오브젝트는 4가지 요소로 구성됩니다:
      # 1. id: 오브젝트 고유 식별자 (obj.으로 시작)
      # 2. name: 오브젝트 이름 (UI에 표시)
      # 3. description: 오브젝트 상세 설명 (클릭 시 표시될 내용)
      # 4. hiddenClue: 숨겨진 핵심 단서 (플레이어가 찾아내야 할 내용)

      - id: obj.example_object_1
        name: 오브젝트 이름
        description: |
          이 오브젝트에 대한 자세한 설명을 작성하세요.
          여러 줄로 작성할 수 있습니다.

          플레이어가 이 오브젝트를 클릭했을 때 보게 될 내용입니다.
        hiddenClue: 플레이어가 추리를 통해 발견해야 할 핵심 단서
        image: null  # 추후 이미지 경로 (예: /assets/objects/obj1.png)

      - id: obj.example_object_2
        name: 또 다른 오브젝트
        description: |
          두 번째 오브젝트 설명
        hiddenClue: 이 오브젝트와 관련된 숨겨진 단서
        image: null

  - id: location.another_place
    name: 다른 장소
    floor: 2층
    description: 두 번째 장소 설명
    objects:
      - id: obj.important_item
        name: 중요한 물건
        description: |
          중요한 물건에 대한 상세 설명
        hiddenClue: 숨겨진 단서
        image: null

# 장소를 더 추가하려면 위의 형식을 복사해서 붙여넣으세요
