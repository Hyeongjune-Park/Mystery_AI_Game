# 게임 인트로 스토리 페이지들
# 최소 1개 이상의 페이지가 필요합니다

pages:
  - title: 사건 발생
    content: |
      여기에 첫 번째 스토리 페이지 내용을 작성하세요.

      여러 줄로 작성할 수 있습니다.
      빈 줄도 포함할 수 있습니다.

      일반적으로 사건이 발생한 상황을 설명합니다.

  - title: 의문점
    content: |
      두 번째 페이지에는 사건의 의문점이나
      배경 정보를 추가할 수 있습니다.

      플레이어가 궁금해할 만한 요소를 제시하세요.

  - title: 당신의 임무
    content: |
      마지막 페이지에는 플레이어의 목표를
      명확하게 제시하면 좋습니다.

      예: "당신은 이 사건을 재조사하게 된 형사다."
      예: "과연 이것은 정말 사고일까?"

# 스토리를 건너뛸 수 있는지 여부
skippable: true
