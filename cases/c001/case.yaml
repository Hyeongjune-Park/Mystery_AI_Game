# 케이스 기본 정보
id: c001
title: 와인잔의 비밀
subtitle: The Secret of the Wine Glass
synopsis: 유명 와인 소믈리에가 자택에서 추락사한 사건. 경찰은 자살로 결론내렸지만, 현장에는 의문점이 남아있다.

# 게임 설정
difficulty: normal  # easy, normal, hard
estimatedMinutes: 30

# 화면 플로우 (순서대로 표시됨)
screenFlow:
  - intro
  - story
  - npcs
  - locations
  - game

# 엔딩 정보
endings:
  - id: bad
    label: 미해결 사건
    tier: bad
    description: 범인을 잘못 지목하거나 증거가 부족하여 사건이 미해결로 종결

  - id: normal
    label: 범인 검거
    tier: normal
    description: 범인을 정확히 지목하고 핵심 증거를 60% 이상 확보

  - id: true
    label: 완벽한 추리
    tier: true
    description: 범인, 동기, 방법을 모두 밝히고 핵심 증거 90% 이상 확보

  - id: timeout
    label: 시간 초과
    tier: timeout
    description: 턴 수를 초과하여 범인이 도주

# 랜덤화 설정
randomization:
  clueOrder: false
  decoyRate: 0.15

# 난이도별 설정
settings:
  turnLimit:
    easy: null
    normal: 50
    hard: 30
  hintLimit:
    easy: null
    normal: 3
    hard: 0
